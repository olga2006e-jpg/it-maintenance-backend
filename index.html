<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Трудоустройство женщин в отпуске по уходу за ребенком</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        body {
            background: rgb(255, 255, 255);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        .accordion-button:not(.collapsed) {
            background: rgb(252, 247, 241) !important;
            color: #8c222b !important;
            box-shadow: none !important;
        }
        
        .accordion-button:focus {
            box-shadow: none !important;
            border-color: #BA2E3A !important;
        }
        
        .accordion-button::after {
            filter: invert(30%) sepia(90%) saturate(1000%) hue-rotate(320deg);
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgb(252, 247, 241);
        }
        
        ::-webkit-scrollbar-thumb {
            background: #BA2E3A;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #8c222b;
        }
    </style>
</head>
<body>
<div id="root"></div>

<script src="app.js" type="module"></script>
<script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
